
# Nombre de nuestra aplicación
spring.application.name=Sinergi Optics International

# Puerto donde funcionará nuestra página web
server.port=8080

# Configuración de conexión con la base de datos H2
spring.datasource.url=jdbc:h2:file:./data/sinergi_db
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Configuración de JPA para trabajar con la base de datos
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Actualiza las tablas automáticamente sin borrar los datos existentes
spring.jpa.hibernate.ddl-auto=update

# Muestra las consultas SQL en la consola
spring.jpa.show-sql=true

# Activamos la consola web de H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ============================================================
# CONFIGURACIÓN DEL TAMAÑO MÁXIMO DE LAS FOTOGRAFÍAS
# ============================================================

# Tamaño máximo permitido para cada archivo de imagen.
spring.servlet.multipart.max-file-size=5MB

# Tamaño máximo permitido para toda la solicitud de subida.
spring.servlet.multipart.max-request-size=5MB
