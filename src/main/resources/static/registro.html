
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Crear cuenta | Sinergi Optics International</title>

    <link rel="stylesheet" href="/css/style.css">

    <style>
        /* Fondo general */
        .registro-page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: #f7f7f5;
        }

        /* Encabezado */
        .registro-header {
            padding: 22px 7%;
            background: white;
            border-bottom: 1px solid #e9e2d5;
        }

        /* Contenedor principal */
        .registro-contenedor {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 45px 20px;
        }

        /* Tarjeta del formulario */
        .registro-card {
            width: 100%;
            max-width: 470px;
            padding: 40px;
            background: white;
            border-radius: 10px;
            border-top: 5px solid #c5a46b;
            box-shadow: 0 10px 35px rgba(9, 24, 43, 0.10);
        }

        .registro-card h1 {
            color: #10243d;
            text-align: center;
            font-size: 28px;
            margin-bottom: 8px;
        }

        .registro-descripcion {
            color: #777f8c;
            text-align: center;
            font-size: 14px;
            margin-bottom: 25px;
        }

        /* Etiquetas */
        .registro-card label {
            display: block;
            margin: 15px 0 7px;
            color: #10243d;
            font-weight: 600;
            font-size: 13px;
        }

        /* Campos de entrada */
        .registro-card input {
            width: 100%;
            padding: 13px;
            border: 1px solid #dce0e5;
            border-radius: 5px;
            font-size: 14px;
            outline: none;
        }

        .registro-card input:focus {
            border-color: #c5a46b;
            box-shadow: 0 0 0 3px rgba(197, 164, 107, 0.12);
        }

        /* Botón de registro */
        .btn-registro {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            background: #10243d;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-registro:hover {
            background: #c5a46b;
            color: #09182b;
        }

        /* Mensajes */
        .registro-mensaje {
            display: none;
            margin-top: 15px;
            padding: 12px;
            border-radius: 5px;
            text-align: center;
            font-size: 13px;
        }

        .registro-exito {
            background: #e5f5eb;
            color: #217346;
        }

        .registro-error {
            background: #fde8e8;
            color: #b42318;
        }

        /* Enlace de inicio de sesión */
        .registro-login {
            margin-top: 25px;
            text-align: center;
            color: #777f8c;
            font-size: 14px;
        }

        .registro-login a {
            color: #10243d;
            font-weight: 700;
            text-decoration: none;
        }

        .registro-login a:hover {
            color: #c5a46b;
        }

        /* Pie de página */
        .registro-footer {
            padding: 20px;
            background: #09182b;
            color: white;
            text-align: center;
            font-size: 12px;
        }

        @media (max-width: 500px) {
            .registro-card {
                padding: 28px 22px;
            }
        }
    </style>
</head>

<body>

    <div class="registro-page">

        <!-- Encabezado -->
        <header class="registro-header">

            <a href="/" class="logo">
                SINERGI <span>OPTICS</span>
                <small>INTERNATIONAL</small>
            </a>

        </header>

        <!-- Formulario de registro -->
        <main class="registro-contenedor">

            <section class="registro-card">

                <h1>Crear una cuenta</h1>

                <p class="registro-descripcion">
                    Regístrate y forma parte de Sinergi Optics International.
                </p>

                <form id="formulario-registro">

                    <!-- Nombre completo -->
                    <label for="nombre">
                        Nombre completo
                    </label>

                    <input
                        type="text"
                        id="nombre"
                        placeholder="Ingresa tu nombre completo"
                        required
                    >

                    <!-- Nombre de usuario -->
                    <label for="username">
                        Nombre de usuario
                    </label>

                    <input
                        type="text"
                        id="username"
                        placeholder="Crea un nombre de usuario"
                        required
                    >

                    <!-- Contraseña -->
                    <label for="password">
                        Contraseña
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Mínimo 8 caracteres"
                        minlength="8"
                        required
                    >

                    <!-- Confirmar contraseña -->
                    <label for="confirmar-password">
                        Confirmar contraseña
                    </label>

                    <input
                        type="password"
                        id="confirmar-password"
                        placeholder="Repite tu contraseña"
                        minlength="8"
                        required
                    >

                    <!-- Botón para crear la cuenta -->
                    <button type="submit" class="btn-registro">
                        CREAR CUENTA
                    </button>

                </form>

                <!-- Mensajes de respuesta -->
                <div id="mensaje-exito" class="registro-mensaje registro-exito"></div>

                <div id="mensaje-error" class="registro-mensaje registro-error"></div>

                <!-- Enlace al inicio de sesión -->
                <div class="registro-login">

                    ¿Ya tienes una cuenta?

                    <a href="/login.html">
                        Iniciar sesión
                    </a>

                </div>

            </section>

        </main>

        <!-- Pie de página -->
        <footer class="registro-footer">

            © 2026 Sinergi Optics International.
            Todos los derechos reservados.

        </footer>

    </div>

    <script>

        // Obtener el token de seguridad CSRF
        let tokenCSRF = "";

        fetch("/api/auth/csrf")
            .then(respuesta => {
                if (!respuesta.ok) {
                    throw new Error("No se pudo obtener el token de seguridad");
                }
                return respuesta.json();
            })
            .then(datos => {
                tokenCSRF = datos.token;
            })
            .catch(error => {
                console.error("Error de seguridad:", error);
            });

        // Registrar un nuevo usuario
        document.getElementById("formulario-registro")
            .addEventListener("submit", async function(evento) {

                evento.preventDefault();

                // Obtener los datos del formulario
                const nombre = document.getElementById("nombre").value.trim();
                const username = document.getElementById("username").value.trim();
                const password = document.getElementById("password").value;
                const confirmar = document.getElementById("confirmar-password").value;

                const mensajeExito = document.getElementById("mensaje-exito");
                const mensajeError = document.getElementById("mensaje-error");

                mensajeExito.style.display = "none";
                mensajeError.style.display = "none";

                // Comprobar que las contraseñas coincidan
                if (password !== confirmar) {
                    mensajeError.textContent = "Las contraseñas no coinciden.";
                    mensajeError.style.display = "block";
                    return;
                }

                // Comprobar la longitud de la contraseña
                if (password.length < 8) {
                    mensajeError.textContent = "La contraseña debe tener al menos 8 caracteres.";
                    mensajeError.style.display = "block";
                    return;
                }

                if (!tokenCSRF) {
                    mensajeError.textContent = "No se pudo obtener el token de seguridad. Recarga la página.";
                    mensajeError.style.display = "block";
                    return;
                }

                try {

                    // Enviar los datos al servidor
                    const respuesta = await fetch("/api/auth/registro", {

                        method: "POST",

                        headers: {
                            "Content-Type": "application/json",
                            "X-XSRF-TOKEN": tokenCSRF
                        },

                        body: JSON.stringify({
                            nombre: nombre,
                            username: username,
                            password: password
                        })

                    });

                    const resultado = await respuesta.text();

                    // Comprobar el resultado del registro
                    if (respuesta.ok) {

                        mensajeExito.textContent =
                            "¡Cuenta creada correctamente! Ahora puedes iniciar sesión.";

                        mensajeExito.style.display = "block";

                        document.getElementById("formulario-registro").reset();

                    } else {

                        mensajeError.textContent = resultado;
                        mensajeError.style.display = "block";

                    }

                } catch (error) {

                    mensajeError.textContent =
                        "No se pudo conectar con el servidor.";

                    mensajeError.style.display = "block";

                }

            });

    </script>

</body>
</html>
